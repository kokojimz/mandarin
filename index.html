<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOCFL 詞彙卡 · Flashcards N1–C1</title>
<style>
  :root{
    --bg:#faf7f2; --card-bg:#ffffff; --text:#222; --sub:#777; --border:#e4ddd0; --accent:#e08b2b;
    --t1:#3f7fe0; --t2:#3fa15e; --t3:#e08b2b; --t4:#e0523f; --t0:#9b5de5;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1a17; --card-bg:#26241f; --text:#eee; --sub:#9a978f; --border:#3a362e;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1a17; --card-bg:#26241f; --text:#eee; --sub:#9a978f; --border:#3a362e;
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Segoe UI",system-ui,sans-serif;
    padding:24px 14px 60px;
  }
  button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  button:focus:not(:focus-visible){ outline:none; }
  button:active{ filter:none; }
  h1{ text-align:center; font-size:1.35rem; margin:0 0 4px; }
  p.sub{ text-align:center; color:var(--sub); margin:16px 0 0; font-size:.72rem; }
  .legend{ display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin:16px 0 0; font-size:.72rem; color:var(--sub); }
  .legend span{ display:flex; align-items:center; gap:4px; }
  .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .controls{ display:flex; justify-content:center; gap:8px; margin:10px 0; flex-wrap:wrap; }
  .controls button, .more button{
    background:var(--card-bg); border:1px solid var(--border); color:var(--text);
    width:40px; height:40px; padding:0; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:.737rem; line-height:1; cursor:pointer; font-family:inherit;
  }
  .controls button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .controls button small{ opacity:.75; margin-left:3px; font-size:.7rem; }
  .tools{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:14px auto 0; max-width:640px; }
  .tools input{
    flex:1 1 200px; min-width:0; padding:8px 16px; border-radius:999px; border:1px solid var(--border);
    background:var(--card-bg); color:var(--text); font-size:16px; font-family:inherit;
  }
  .tools button{
    background:var(--card-bg); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:6px 12px; font-size:1rem; cursor:pointer; font-family:inherit;
  }
  .tools button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .quiz-card{ width:min(90vw,420px); }
  .qz-hanzi{ font-size:2.4rem; font-weight:700; margin-bottom:4px; }
  .qz-sub{ font-size:.8rem; color:var(--sub); margin-bottom:18px; }
  .qz-options{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
  .qz-opt{
    padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:transparent;
    color:var(--text); font-size:1rem; font-family:inherit; cursor:pointer; text-align:center;
  }
  .qz-options.done .qz-opt{ cursor:default; }
  .qz-opt .qz-hz{ margin-left:8px; font-weight:600; opacity:.85; }
  .qz-opt .qz-hz .qz-arrow{ margin-right:8px; font-weight:normal; }
  .qz-opt.correct{ background:#1e9e5a; color:#fff; border-color:#1e9e5a; }
  .qz-opt.wrong{ background:#d64545; color:#fff; border-color:#d64545; }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:12px; max-width:960px; margin:16px auto 0;
    align-content:start;
  }
  .card{
    background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
    text-align:center; cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    perspective:700px; height:150px; position:relative;
  }
  .card-inner{ position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d; }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 8px;
  }
  .back{ transform:rotateY(180deg); overflow:hidden; padding-bottom:43px; }
  .play{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    min-width:48px; height:30px; padding:0; border:0; background:transparent;
    color:var(--sub); font-size:1.05rem; line-height:1; cursor:pointer; font-family:inherit;
    -webkit-tap-highlight-color:transparent; outline:0;
  }
  .play.playing{ font-size:.9rem; }
  .hanzi{ font-size:2.8rem; line-height:1.2; word-break:break-all; }
  .hanzi.m{ font-size:1.9rem; }
  .hanzi.l{ font-size:1.35rem; }
  .hz-small{ font-size:1.5rem; margin-bottom:2px; line-height:1.25; word-break:break-all; }
  .hz-small.l{ font-size:1.1rem; }
  .pinyin{ font-size:1.2rem; font-weight:700; margin-bottom:3px; line-height:1.25; }
  .meaning{
    font-size:.74rem; color:var(--sub); line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .alt{ font-size:.68rem; color:var(--sub); margin-top:3px; }
  .lv{ position:absolute; top:6px; left:8px; font-size:.6rem; color:var(--sub); opacity:.85; }
  .pager{ display:flex; justify-content:center; align-items:center; gap:6px; flex-wrap:wrap; margin:26px auto 6px; max-width:960px; scroll-margin-bottom:120px; }
  .pager button{
    min-width:34px; height:34px; padding:0 8px; border-radius:8px;
    background:var(--card-bg); color:var(--text); border:1px solid var(--border);
    font-size:.85rem; cursor:pointer; font-family:inherit;
  }
  .pager button.cur{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .pager button:disabled{ opacity:.4; cursor:default; }
  .pager span.dots{ color:var(--sub); padding:0 2px; font-size:.85rem; }
  .empty{ text-align:center; color:var(--sub); padding:40px 0; }
  footer{ text-align:center; color:var(--sub); font-size:.72rem; margin-top:28px; line-height:1.5; }
  #peek{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
    background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .15s;
  }
  #peek.on{ opacity:1; }
  #peek.stay{ pointer-events:auto; cursor:pointer; }
  .peek-card{
    width:min(88vw,440px); max-height:82vh; overflow:auto; text-align:center;
    background:var(--card-bg); color:var(--text); border:1px solid var(--border); border-radius:20px;
    position:relative; padding:26px 22px; box-shadow:0 20px 60px rgba(0,0,0,.35);
    transform:scale(.85); transition:transform .18s ease;
  }
  #peek.on .peek-card{ transform:scale(1); }
  .confirm-overlay{
    position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
    background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .15s;
  }
  .confirm-overlay.on{ opacity:1; pointer-events:auto; }
  .confirm-card{
    width:min(88vw,380px); text-align:center;
    background:var(--card-bg); color:var(--text); border:1px solid var(--border); border-radius:20px;
    padding:26px 22px; box-shadow:0 20px 60px rgba(0,0,0,.35);
    transform:scale(.9); transition:transform .18s ease;
  }
  .confirm-overlay.on .confirm-card{ transform:scale(1); }
  .cf-title{ font-weight:700; font-size:1.05rem; margin-bottom:8px; }
  .cf-msg{ font-size:.85rem; color:var(--sub); line-height:1.55; margin-bottom:20px; }
  .cf-actions{ display:flex; gap:10px; justify-content:center; }
  .cf-btn{ flex:1; padding:11px 0; border-radius:12px; border:1px solid var(--border); font-size:.9rem; font-weight:600; cursor:pointer; background:transparent; color:var(--text); }
  .cf-btn.cf-yes{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .pk-lv{ font-size:.75rem; color:var(--sub); margin-bottom:8px; }
  .pk-hanzi{ font-size:4rem; line-height:1.2; word-break:break-all; }
  .pk-hanzi.m{ font-size:2.8rem; }
  .pk-hanzi.l{ font-size:1.9rem; }
  .pk-hz{ font-size:2.4rem; line-height:1.2; margin-bottom:6px; word-break:break-all; }
  .pk-hz.l{ font-size:1.6rem; }
  .pk-py{ font-size:1.7rem; font-weight:700; line-height:1.3; margin-bottom:12px; }
  .pk-m{ font-size:1.1rem; line-height:1.5; opacity:.9; }
  .pk-example-toggle{
    display:flex; align-items:center; justify-content:center; gap:6px; margin:16px auto 0; padding:7px 14px; border-radius:999px;
    border:1px solid var(--border); background:transparent; color:var(--accent);
    font-size:.8rem; font-family:inherit; cursor:pointer;
  }
  .pk-arrow{ display:inline-block; font-size:1em; line-height:1; transition:transform .15s ease; }
  .pk-arrow.up{ transform:rotate(180deg); }
  .pk-examples{ margin-top:14px; padding-top:14px; border-top:1px solid var(--border); text-align:left; }
  .pk-ex-item{ margin-bottom:12px; }
  .pk-ex-item:last-child{ margin-bottom:0; }
  .pk-ex-hz{ font-size:1.15rem; line-height:1.4; }
  .pk-ex-py{ font-size:.85rem; margin:2px 0; }
  .pk-ex-en{ font-size:.8rem; color:var(--sub); }
  .fav-toggle{
    position:absolute; right:0; bottom:0; width:30px; height:46px; padding:0 0 6px 0;
    display:flex; align-items:flex-end; justify-content:center;
    border:0; background:transparent; color:var(--sub); cursor:pointer;
    font-family:inherit; font-size:1.45rem; line-height:1;
    -webkit-tap-highlight-color:transparent; outline:0;
  }
  .fav-toggle::before{ content:'☆'; display:inline-block; }
  .card.isfav .fav-toggle{ color:var(--accent); }
  .card.isfav .fav-toggle::before{ content:'★'; }
  .bm-toggle{
    position:absolute; top:0; right:0; width:30px; height:46px; padding:6px 0 0 0;
    display:flex; align-items:flex-start; justify-content:center;
    border:0; background:transparent; color:var(--sub); cursor:pointer;
    -webkit-tap-highlight-color:transparent; outline:0;
  }
  .bm-toggle svg{ display:block; }
  .bm-toggle svg path{ fill:none; stroke:currentColor; stroke-width:1.5; stroke-linejoin:round; }
  .card.isbm .bm-toggle{ color:var(--accent); }
  .card.quiz-pending{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .card.isbm .bm-toggle svg path{ fill:var(--accent); }
  .card.flash{ animation:bmflash 1.4s ease; }
  @keyframes bmflash{ 0%{transform:scale(1)} 20%{transform:scale(1.07)} 40%{transform:scale(1)} 60%{transform:scale(1.05)} 100%{transform:scale(1)} }
  .resume{
    display:flex; align-items:center; gap:12px; max-width:960px; margin:16px auto 0;
    padding:10px 12px; background:var(--card-bg); border:1px solid var(--border);
    border-radius:12px; cursor:pointer; text-align:left;
  }
  .resume[hidden]{ display:none; }
  .resume .rb{
    width:16px; height:24px; background:var(--accent); flex:none;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
  }
  .resume .rt{ flex:1; min-width:0; }
  .resume .rn{ font-size:.95rem; font-weight:600; }
  .resume .rs{ font-size:.75rem; color:var(--sub); }
  .resume .rc{ color:var(--sub); font-size:1.3rem; line-height:1; }
  @media (max-width: 600px){
    body{ padding:20px 10px 60px; }
    .pager button{ min-width:30px; height:30px; padding:0 6px; font-size:.8rem; }
    /* level circles: always one line, shrink with the screen width */
    .controls{ flex-wrap:nowrap; gap:clamp(4px,1.8vw,9px); }
    .controls button, .more button{ flex:1 1 0; min-width:0; max-width:50px; width:auto; height:auto; aspect-ratio:1/1; font-size:clamp(.5rem,2.8vw,.75rem); overflow:hidden; }
    .tools{ flex-wrap:nowrap; gap:6px; }
    .tools input{ flex:1 1 0; padding:8px 12px; }
    .tools button{ flex:0 0 auto; padding:6px 8px; }
    .grid{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .card{ height:138px; border-radius:12px; }
    .face{ padding:6px 5px; }
    .back{ padding-bottom:39px; }
    .play{ height:26px; bottom:12px; }
    .hanzi{ font-size:2.35rem; }
    .hanzi.m{ font-size:1.5rem; }
    .hanzi.l{ font-size:1.15rem; }
    .hz-small{ font-size:1.3rem; }
    .hz-small.l{ font-size:1rem; }
    .pinyin{ font-size:1.05rem; }
    .meaning{ font-size:.66rem; line-height:1.25; -webkit-line-clamp:2; }
    .lv{ top:4px; left:6px; font-size:.55rem; }
    .fav-toggle{ padding:0 0 4px 0; font-size:1.3rem; }
    .bm-toggle{ padding:5px 0 0 0; }
  }
</style>
</head>
<body>

<div class="controls" id="levelBar"></div>

<div class="tools">
  <input id="q" type="search" placeholder="Search…" autocomplete="off">
  <button id="sortBtn" title="Reset order" aria-label="Reset order">↩️</button>
  <button id="shuffleBtn" title="Shuffle">🔀</button>
  <button id="revealBtn" title="Reveal / hide all" aria-label="Reveal / hide all">🔄</button>
  <button id="quizBtn" title="Start quiz" aria-label="Start quiz">📖</button>
</div>

<p class="sub" id="countSub"></p>

<div class="legend">
  <span><span class="dot" style="background:var(--t1)"></span>1st tone</span>
  <span><span class="dot" style="background:var(--t2)"></span>2nd tone</span>
  <span><span class="dot" style="background:var(--t3)"></span>3rd tone</span>
  <span><span class="dot" style="background:var(--t4)"></span>4th tone</span>
  <span><span class="dot" style="background:var(--t0)"></span>neutral</span>
</div>

<div class="resume" id="resume" role="button" tabindex="0" hidden>
  <span class="rb"></span>
  <div class="rt"><div class="rn"></div><div class="rs"></div></div>
  <span class="rc">›</span>
</div>

<div class="grid" id="grid"></div>
<div class="pager" id="pager"></div>

<footer>許木德 · ISU 11461325A · 2026<br>Vocabulary: TOCFL · Meanings: CC-CEDICT</footer>

<div id="peek" aria-hidden="true"><div class="peek-card" id="peekBox"></div></div>
<div id="confirmOverlay" class="confirm-overlay" aria-hidden="true">
  <div class="confirm-card" id="confirmBox">
    <div class="cf-title" id="cfTitle"></div>
    <div class="cf-msg" id="cfMsg"></div>
    <div class="cf-actions">
      <button type="button" id="cfNo" class="cf-btn cf-no">No</button>
      <button type="button" id="cfYes" class="cf-btn cf-yes">Yes</button>
    </div>
  </div>
</div>
<div id="quizOverlay" class="confirm-overlay" aria-hidden="true">
  <div class="confirm-card quiz-card" id="quizBox">
    <div class="qz-hanzi" id="qzHanzi"></div>
    <div class="qz-sub" id="qzSub">Which pinyin matches this word?</div>
    <div class="qz-options" id="qzOptions"></div>
  </div>
</div>

const MARKS = {1:'āēīōūǖ', 2:'áéíóúǘ', 3:'ǎěǐǒǔǚ', 4:'àèìòùǜ'};
function toneOf(tok){
  if(tok.startsWith('·')) return 0;
  for(const ch of tok){ for(const t in MARKS){ if(MARKS[t].includes(ch)) return +t; } }
  return 0;
}

function colorPinyin(py){
  return py.split(' ').map(tok => tok === '/' ? '<span style="color:var(--sub)">/</span>'
    : `<span style="color:${tv(toneOf(tok))}">${esc(tok)}</span>`).join(' ');
}
function colorHanzi(w, py){
  const chars = [...fullWord(w)];
  if(py.includes('/')) return esc(fullWord(w));
  const toks = py.split(' ');
  if(chars.length !== toks.length) return esc(fullWord(w));
  return chars.map((c,i)=>`<span style="color:${tv(toneOf(toks[i]))}">${esc(c)}</span>`).join('');
}
const sizeClass = w => { const n=[...fullWord(w)].length; return n>4?'l':(n>2?'m':''); };

function counts(){
  const c = {}; D.forEach(r => c[r[4]] = (c[r[4]]||0)+1); return c;

const C = counts();

function buildBar(){
  const bar = document.getElementById('levelBar');
  bar.innerHTML = '';
  LEVELS.forEach(([code,name])=>{
    const b = document.createElement('button');
    b.dataset.l = code; b.className = 'active'; b.title = name;
    b.innerHTML = `${code}`;
    b.addEventListener('click', ()=>{
      if(active.has(code)){ active.delete(code); b.classList.remove('active'); }
      else { active.add(code); b.classList.add('active'); }
      syncAll(); refresh(true);
      levelsTouched = true; scheduleSave();
    });
    bar.appendChild(b);
  });
  const all = document.createElement('button');
  all.id = 'allBtn'; all.className = 'active'; all.textContent = 'All';
  all.addEventListener('click', ()=>{
    const on = !(active.size === LEVELS.length && favOn);
    active.clear();
    if(on) LEVELS.forEach(l=>active.add(l[0]));
    favOn = on;
    bar.querySelectorAll('button[data-l]').forEach(b=>b.classList.toggle('active', on));
    document.getElementById('favBtn').classList.toggle('active', on);
    syncAll(); refresh(true);
    levelsTouched = true; scheduleSave();
  });
  bar.appendChild(all);
  const fav = document.createElement('button');
  fav.id = 'favBtn'; fav.title = 'Favorites'; fav.className = favOn ? 'active' : '';
  fav.innerHTML = `★`;
  fav.addEventListener('click', ()=>{
    favOn = !favOn;                  // extra group: adds favorites on top of the selected levels
    fav.classList.toggle('active', favOn);
    syncAll();
    refresh(true);
    levelsTouched = true; scheduleSave();
  });
  bar.insertBefore(fav, all);
}
function syncAll(){ document.getElementById('allBtn').classList.toggle('active', active.size === LEVELS.length && favOn); }

// ---------- quiz mode ----------
let quizMode = false;
const quizResults = new Map();   // card key -> true (right) / false (wrong); first answer per card only
const quizBtn = document.getElementById('quizBtn');
const quizOverlay = document.getElementById('quizOverlay');
const qzHanzi = document.getElementById('qzHanzi');
const qzSub = document.getElementById('qzSub');
const qzOptions = document.getElementById('qzOptions');
function toggleQuiz(){
  quizMode = !quizMode;
  quizResults.clear();                   // score starts fresh each time quiz mode is switched
  openedOnce.clear();                    // "already opened" also starts fresh each time quiz mode is switched
  if(quizMode){                          // entering quiz: close every card so all of them start face-down
    flippedKeys.clear();
    revealAll = false;
    pendingFlips = null;
    if(searchSnap){ searchSnap.flipped = new Set(); searchSnap.reveal = false; }   // a search started before quiz must not bring old open cards back
    grid.querySelectorAll('.card.flipped').forEach(c => c.classList.remove('flipped'));
  }
  quizBtn.textContent = quizMode ? '🧠' : '📖';
  quizBtn.title = quizBtn.ariaLabel = quizMode ? 'Back to study mode' : 'Start quiz';
  grid.querySelectorAll('.card').forEach(c=>{
    c.classList.toggle('quiz-pending', quizMode && !openedOnce.has(c.dataset.key));
  });
  updateCountSub();
}
quizBtn.addEventListener('click', function(){
  if(quizMode && quizResults.size > 0){
    askConfirm('Exit quiz mode?', 'Exiting quiz mode will reset your quiz score.')
      .then(ok => { if(ok) toggleQuiz(); });
    return;
  }
  toggleQuiz();
});
let pendingQuizCard = null, pendingQuizKey = null;
let quizAnswered = false, quizAnsweredAt = 0, quizNext = null;
function openQuiz(r, card){
  const w = r[0], correct = r[1];
  qzHanzi.style.display = '';
  qzSub.style.display = '';
  qzHanzi.textContent = w;
  quizAnswered = false; quizNext = null;
  qzSub.textContent = 'Which pinyin matches this word?';
  const targetLen = [...fullWord(w)].length;
  const isRedup = s => { const c = [...fullWord(s)]; for(let i=0;i<c.length-1;i++) if(c[i]===c[i+1]) return true; return false; };
  const wordIsRedup = isRedup(w);
  // Reduplicated words (妈妈, 谢谢, ...) have a giveaway pinyin shape (repeated syllable / "·"),
  // so when the correct word is reduplicated, pick wrong options that are reduplicated too.
  let wrongPool = D.filter(x => x[1] !== correct && [...fullWord(x[0])].length === targetLen && (!wordIsRedup || isRedup(x[0])));
  if(wrongPool.length < 2 && wordIsRedup){
    wrongPool = D.filter(x => x[1] !== correct && isRedup(x[0]));   // relax length match but keep reduplication
  }
  if(wrongPool.length < 2){
    wrongPool = D.filter(x => x[1] !== correct);   // fallback if not enough matching words
  }
  const usedIdx = new Set();
  const wrongs = [];
  while(wrongs.length < 2 && wrongs.length < wrongPool.length){
    const idx = Math.floor(Math.random() * wrongPool.length);
    if(usedIdx.has(idx)) continue;
    usedIdx.add(idx);
    wrongs.push(wrongPool[idx]);
  }
  const options = [{py:correct, hz:w, ok:true}, ...wrongs.map(x => ({py:x[1], hz:x[0], ok:false}))];
  for(let i = options.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = options[i]; options[i] = options[j]; options[j] = tmp;
  }
  qzOptions.innerHTML = '';
  qzOptions.classList.remove('done');
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'qz-opt';
    btn.textContent = opt.py;
    btn.dataset.ok = opt.ok ? '1' : '';
    btn.addEventListener('click', ev => {
      if(quizAnswered) return;            // already answered: let the tap bubble up to the overlay
      ev.stopPropagation();
      quizAnswered = true; quizAnsweredAt = Date.now();
      if(!quizResults.has(keyOf(r))) quizResults.set(keyOf(r), btn.dataset.ok === '1');   // only the first answer per card counts
      updateCountSub();
      quizNext = () => { closeQuiz(); pendingQuizCard = card; pendingQuizKey = keyOf(r); finishQuiz(); };   // no back-of-card preview: just flip it in the grid
      Array.from(qzOptions.children).forEach(c => {
        if(c.dataset.ok === '1') c.classList.add('correct');
        else{
          if(c === btn) c.classList.add('wrong');
          const i = Array.from(qzOptions.children).indexOf(c);
          const hz = document.createElement('span');
          hz.className = 'qz-hz';
          const dash = document.createElement('span');
          dash.className = 'qz-arrow';
          dash.textContent = '→';
          hz.appendChild(dash);
          hz.appendChild(document.createTextNode(options[i].hz));      // show which word each wrong pinyin belongs to, separated from it
          c.appendChild(hz);
        }
      });
      qzOptions.classList.add('done');
      qzSub.textContent = 'Tap anywhere to continue';
    });
    qzOptions.appendChild(btn);
  });
  quizOverlay.classList.add('on');
  quizOverlay.setAttribute('aria-hidden', 'false');
}
function showQuizBack(r, card){
  // Reuse the normal preview card (same back side as long-press) instead of a second, duplicate card.
  closeQuiz();
  pendingQuizCard = card;
  pendingQuizKey = keyOf(r);
  showPeek(r, true);
  suppressUntil = Date.now() + 150;
  peekHeld = false;                 // already "released": tap anywhere to dismiss
  peekEl.classList.add('stay');
}
function closeQuiz(){
  quizOverlay.classList.remove('on');
  quizOverlay.setAttribute('aria-hidden', 'true');
}
function finishQuiz(){              // called when the preview closes: flip the card in the grid
  if(pendingQuizCard){
    pendingQuizCard.classList.add('flipped');
    pendingQuizCard.classList.remove('quiz-pending');
    flippedKeys.add(pendingQuizKey);
    openedOnce.add(pendingQuizKey);
    pendingQuizCard = null;
    pendingQuizKey = null;
  }
}
quizOverlay.addEventListener('click', ev => {
  if(quizAnswered){
    if(Date.now() - quizAnsweredAt < 250) return;   // ignore an accidental double-tap
    quizAnswered = false;
    const go = quizNext; quizNext = null;
    if(go) go();
  } else if(ev.target === quizOverlay) closeQuiz();
});

let peekR = null;
let peekExampleOpen = false;
function peekHTML(r, flipped){
  const [w,py,m,a,l] = r;
  const sc = sizeClass(w);
  if(!flipped) return `<div class="pk-lv">${l}</div><div class="pk-hanzi ${sc}">${esc(w)}</div>`;
  const ex = EXAMPLES[keyOf(r)];
  let exampleHTML = '';
  if(ex){
    if(peekExampleOpen){
      exampleHTML += `<div class="pk-examples">` + ex.map(e => `
        <div class="pk-ex-item">
          <div class="pk-ex-hz">${colorHanzi(e.hz, e.py)}</div>
          <div class="pk-ex-py">${esc(e.py)}</div>
          <div class="pk-ex-en">${esc(e.en)}</div>
        </div>`).join('') + `</div>`;
    }
    exampleHTML += `<button type="button" class="pk-example-toggle">${peekExampleOpen ? 'Hide example' : 'Show example'}<span class="pk-arrow${peekExampleOpen ? ' up' : ''}">▼</span></button>`;
  }
  return `<div class="pk-lv">${l}</div>
    <div class="pk-hz ${sc==='l'?'l':''}">${colorHanzi(w,py)}</div>
    <div class="pk-py">${colorPinyin(py)}</div>
    <div class="pk-m">${esc(m)}</div>
    ${exampleHTML}`;
}
function showPeek(r, flipped){
  peekR = r;
  peekExampleOpen = false;
  peekBox.innerHTML = peekHTML(r, flipped);
  peekBox.scrollTop = 0;
  peekEl.classList.remove('stay');
  peekEl.classList.add('on');
  peekOn = true; peekHeld = true;
}
// The example toggle lives inside peekBox, which sits inside peekEl (whose own
// pointerdown/click handlers close the preview on any tap once it's "stay").
// Stopping propagation here keeps a tap on the toggle from closing the card.
peekBox.addEventListener('pointerdown', e=>{
  if(e.target.closest('.pk-example-toggle')) e.stopPropagation();
});
peekBox.addEventListener('click', e=>{
  const btn = e.target.closest('.pk-example-toggle');
  if(!btn) return;
  e.stopPropagation();
  peekExampleOpen = !peekExampleOpen;
  const flippedNow = !!peekBox.querySelector('.pk-hz');
  peekBox.innerHTML = peekHTML(peekR, flippedNow);
});
function closePeek(){
  peekOn = false; peekHeld = false;
  peekEl.classList.remove('on', 'stay');
  finishQuiz();
}
function endPress(){
  clearTimeout(pressTimer); pressTimer = null;
  if(peekOn && peekHeld){          // finger lifted: keep the preview open
    peekHeld = false;
    peekEl.classList.add('stay');
    suppressUntil = Date.now() + 120;   // only swallows the click that comes with lifting the finger
  }
}
// Close the moment the screen is touched (no waiting for the finger to lift, no cool-down).
// The rest of that same tap is swallowed so it can't flip the card underneath.
let swallowTap = false;
peekEl.addEventListener('pointerdown', ()=>{
  if(peekOn && !peekHeld){ closePeek(); swallowTap = true; }
});
const endSwallow = ()=>{ if(swallowTap) setTimeout(()=>{ swallowTap = false; }, 80); };
// The tap that dismisses the preview must do nothing else: swallow its click before it can
// reach ANY control underneath (play button, favorite, bookmark, pager, filters, ...).
document.addEventListener('click', e=>{
  if(swallowTap){ e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener('pointerup', endSwallow);
document.addEventListener('pointercancel', endSwallow);
peekEl.addEventListener('click', ()=>{ if(peekOn && !peekHeld && Date.now() >= suppressUntil) closePeek(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && peekOn) closePeek(); });
document.addEventListener('pointerup', endPress);
document.addEventListener('pointercancel', endPress);
document.addEventListener('touchmove', e=>{ if(peekOn && !peekBox.contains(e.target)) e.preventDefault(); }, {passive:false});


// ---------- favorites storage ----------
// Saved in the viewer's private Claude storage (db: data/users/<id>/favs).
// Falls back to this browser's localStorage when Claude storage is unavailable.
const keyOf = r => fullWord(r[0]);
const LS_KEY = 'tocfl-favs-v1';
const LS_BM = 'tocfl-bm-v1';
const LS_LV = 'tocfl-levels-v1';
let backend = 'local', favDoc = null, ready = false, saving = false, again = false, saveTimer = null;
const pending = new Map();

const isDirty = () => saveTimer !== null || saving;

function updateFavUI(){
  const s = document.querySelector('#favBtn small');
  if(s) s.textContent = favs.size;
  grid.querySelectorAll('.card').forEach(c=>c.classList.toggle('isfav', favs.has(c.dataset.key)));
}
function toggleFav(k){
  const on = !favs.has(k);
  if(on) favs.add(k); else favs.delete(k);
  if(!ready) pending.set(k, on); else scheduleSave();
  updateFavUI();
  return on;
}
// After a favorite is added/removed: if that changes whether the card belongs in the current list
// (e.g. only the favorites group is on and the card was just un-favorited), drop it right away, staying on the same page.
function afterFavChange(k){
  const row = D.find(r => keyOf(r) === k);
  if(!row) return;
  const shown = active.has(row[4]) || (favOn && favs.has(k));
  const inList = list.some(i => keyOf(D[i]) === k);
  if(shown !== inList) refresh(true, true);
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer = null; flushSave(); }, 300);
}
async function writeFavs(){
  const keys = [...favs];
  const bm = bookmark || '';
  const levels = [...active];
  if(backend === 'db' && favDoc){
    try{ await favDoc.set({keys, bookmark: bm, levels, favOn}); return; }
    catch(e){
      if(e && e.code === 'unavailable'){
        await new Promise(r=>setTimeout(r, 700 + Math.random()*500));
        try{ await favDoc.set({keys, bookmark: bm, levels, favOn}); return; }catch(e2){}
      }
      console.warn('favorites: could not save to Claude', e);
    }
  }
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(keys));
    localStorage.setItem(LS_BM, bm);
    localStorage.setItem(LS_LV, JSON.stringify({levels, favOn}));
  }catch(e){}
}
async function flushSave(){
  if(saving){ again = true; return; }
  saving = true;
  try{ do{ again = false; await writeFavs(); }while(again); }
  finally{ saving = false; }
}
function applyLoadedLevels(levels, favOnLoaded){
  if(levelsTouched || !Array.isArray(levels)) return;   // null/undefined = nothing saved yet; [] = saved as "none selected"
  active.clear();
  levels.forEach(l => { if(LEVELS.some(x => x[0] === l)) active.add(l); });
  favOn = !!favOnLoaded;
  document.querySelectorAll('#levelBar button[data-l]').forEach(b => b.classList.toggle('active', active.has(b.dataset.l)));
  const favBtn = document.getElementById('favBtn');
  if(favBtn) favBtn.classList.toggle('active', favOn);
  syncAll();
  refresh(true);
}
function applyLoaded(keys, bm, levels, favOnLoaded){
  favs.clear();
  keys.forEach(k=>favs.add(k));
  pending.forEach((on,k)=>{ if(on) favs.add(k); else favs.delete(k); });   // taps made before loading finished
  const hadPending = pending.size > 0;
  pending.clear();
  if(!bmTouched) bookmark = bm || null;     // a bookmark set before loading finished wins
  const hadBm = bmTouched;
  bmTouched = false;
  applyLoadedLevels(levels, favOnLoaded);   // a level/favorites-filter tap before loading finished wins
  const hadLevels = levelsTouched;
  levelsTouched = false;
  ready = true;
  if(hadPending || hadBm || hadLevels) scheduleSave();
  updateFavUI();
  updateBookmarkUI();
}
function loadLocal(){
  let keys = [], bm = null, levels = null, favOnLoaded = true;
  try{
    const raw = localStorage.getItem(LS_KEY); if(raw) keys = JSON.parse(raw);
    bm = localStorage.getItem(LS_BM) || null;
    const lv = localStorage.getItem(LS_LV);
    if(lv){ const p = JSON.parse(lv); levels = Array.isArray(p.levels) ? p.levels : null; favOnLoaded = p.favOn !== false; }
  }catch(e){}
  applyLoaded(Array.isArray(keys) ? keys : [], bm, levels, favOnLoaded);
}
async function initStorage(){
  let db = null, uid = null;
  try{
    const c = window.claude;
    if(c && typeof c.use === 'function'){
      const [d, u] = await Promise.all([c.use('db'), c.use('user')]);
      db = d;
      if(u) uid = await u.id();
    }
  }catch(e){}
  if(db && uid){
    try{
      favDoc = db.doc('data/users/' + uid + '/favs');
      backend = 'db';
      favDoc.onSnapshot(snap=>{
        const data = snap.exists ? snap.data() : null;
        const keys = (data && Array.isArray(data.keys)) ? data.keys : [];
        const bm = (data && typeof data.bookmark === 'string' && data.bookmark) ? data.bookmark : null;
        const levels = (data && Array.isArray(data.levels)) ? data.levels : null;
        const favOnLoaded = data ? data.favOn !== false : true;
        if(!ready){ applyLoaded(keys, bm, levels, favOnLoaded); }
        else if(!isDirty()){
          favs.clear(); keys.forEach(k=>favs.add(k)); bookmark = bm;
          applyLoadedLevels(levels, favOnLoaded);
          updateFavUI(); updateBookmarkUI();
        }
      }, err=>{
        console.warn('favorites: Claude sync stopped', err);
        backend = 'local'; favDoc = null;
        if(!ready) loadLocal();
      });
      setTimeout(()=>{ if(!ready){ backend = 'local'; favDoc = null; loadLocal(); } }, 8000);
      return;
    }catch(e){ backend = 'local'; favDoc = null; }
  }
  loadLocal();
}



// ---------- bookmark (one manual "stopped here" marker) ----------
function bmInfo(){
  if(!bookmark) return null;
  const i = D.findIndex(r => keyOf(r) === bookmark);
  if(i < 0) return null;
  const lvl = D[i][4];
  let k = 0;
  for(let j = 0; j <= i; j++) if(D[j][4] === lvl) k++;
  return {i, lvl, k, total: C[lvl] || 0, word: fullWord(D[i][0])};
}
function updateBookmarkUI(){
  grid.querySelectorAll('.card').forEach(c=>{
    c.classList.toggle('isbm', !!bookmark && c.dataset.key === bookmark);
  });
  const bar = document.getElementById('resume');
  const info = bmInfo();
  if(!info){ bar.hidden = true; return; }
  bar.hidden = false;
  bar.querySelector('.rn').textContent = 'Continue from ' + info.word;
  bar.querySelector('.rs').textContent = info.lvl + ' · card ' + info.k + ' of ' + info.total;
}
function setBookmark(k){
  bookmark = (bookmark === k) ? null : k;      // tapping the marked card again removes the bookmark
  if(!ready) bmTouched = true; else scheduleSave();
  updateBookmarkUI();
}
function goToBookmark(){
  const info = bmInfo();
  if(!info) return;
  order = D.map((_,i)=>i);   // always sort back to the original order before jumping to the bookmark
  if(query.trim() !== ''){
    clearTimeout(tm);
    query = ''; searchSnap = null;
    document.getElementById('q').value = '';
  }
  if(!active.has(info.lvl) && !(favOn && favs.has(bookmark))){
    active.add(info.lvl);
    const b = document.querySelector('#levelBar button[data-l="' + info.lvl + '"]');
    if(b) b.classList.add('active');
    syncAll();
  }
  refresh(true);
  const pos = list.indexOf(info.i);
  if(pos < 0) return;
  page = Math.floor(pos / pageSize()) + 1;
  renderPage();
  const el = [...grid.querySelectorAll('.card')].find(c => c.dataset.key === bookmark);
  if(!el) return;
  el.scrollIntoView({block:'center', behavior:'smooth'});
  el.classList.add('flash');
  setTimeout(()=> el.classList.remove('flash'), 1400);
}
document.getElementById('resume').addEventListener('click', goToBookmark);
document.getElementById('resume').addEventListener('keydown', e=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goToBookmark(); } });

// ---------- pronunciation (device text-to-speech, zh-TW) ----------
const HAS_TTS = ('speechSynthesis' in window) && typeof SpeechSynthesisUtterance !== 'undefined';
let playingBtn = null;
function pickVoice(){
  let vs = [];
  try{ vs = window.speechSynthesis.getVoices() || []; }catch(e){}
  const norm = v => (v.lang || '').replace('_','-').toLowerCase();
  return vs.find(v => norm(v) === 'zh-tw') || vs.find(v => norm(v).startsWith('zh-tw')) ||
         vs.find(v => norm(v).startsWith('zh')) || null;
}
function setIdle(b){ b.classList.remove('playing'); b.textContent = '▶︎'; b.setAttribute('aria-label','Play pronunciation'); }
function setPlaying(b){ b.classList.add('playing'); b.textContent = '■'; b.setAttribute('aria-label','Stop'); }
function stopSpeech(){
  if(!HAS_TTS) return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(playingBtn){ setIdle(playingBtn); playingBtn = null; }
}
function speak(text, btn){
  if(!HAS_TTS) return;
  stopSpeech();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  const v = pickVoice();
  if(v){ u.voice = v; u.lang = v.lang; }
  u.rate = 0.85;
  const done = ()=>{ setIdle(btn); if(playingBtn === btn) playingBtn = null; };
  u.onend = done; u.onerror = done;
  setPlaying(btn); playingBtn = btn;         // show ■ right away
  try{ window.speechSynthesis.speak(u); }catch(e){ done(); }
}

function makeCard(r){
  const [w,py,m,a,l] = r;
  const sc = sizeClass(w);
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.key = keyOf(r);
  if(favs.has(card.dataset.key)) card.classList.add('isfav');
  if(bookmark && card.dataset.key === bookmark) card.classList.add('isbm');
  if(quizMode && !openedOnce.has(card.dataset.key)) card.classList.add('quiz-pending');
  card.innerHTML = `
    <div class="card-inner">
      <div class="face front"><span class="lv">${l}</span><div class="hanzi ${sc}">${esc(w)}</div><button class="bm-toggle" type="button" aria-label="Bookmark"><svg viewBox="0 0 14 20" width="12" height="17" aria-hidden="true"><path d="M1.2 1.2h11.6v17.4L7 14.2 1.2 18.6z"/></svg></button><button class="fav-toggle" type="button" aria-label="Favorite"></button></div>
      <div class="face back">
        <div class="hz-small ${sc==='l'?'l':''}">${colorHanzi(w,py)}</div>
        <div class="pinyin">${colorPinyin(py)}</div>
        <div class="meaning">${esc(m)}</div>
        <button class="play" type="button" aria-label="Play pronunciation">▶︎</button>
      </div>
    </div>`;
  card.addEventListener('click', ()=>{
    if(swallowTap || Date.now() < suppressUntil) return;
    if(quizMode && !openedOnce.has(card.dataset.key)){ openQuiz(r, card); return; }   // never opened before: quiz first
    const isFlipped = card.classList.toggle('flipped');
    if(isFlipped){ flippedKeys.add(card.dataset.key); openedOnce.add(card.dataset.key); card.classList.remove('quiz-pending'); }
    else flippedKeys.delete(card.dataset.key);
  });
  card.addEventListener('pointerdown', ev=>{
    if(ev.pointerType === 'mouse' && ev.button !== 0) return;
    sx = ev.clientX; sy = ev.clientY;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(()=>{ pressTimer = null; showPeek(r, card.classList.contains('flipped')); }, 220);
  });
  card.addEventListener('pointermove', ev=>{
    if(pressTimer && (Math.abs(ev.clientX - sx) > 10 || Math.abs(ev.clientY - sy) > 10)){
      clearTimeout(pressTimer); pressTimer = null;
    }
  });
  card.addEventListener('contextmenu', ev=> ev.preventDefault());
  const fb = card.querySelector('.fav-toggle');
  fb.addEventListener('pointerdown', ev=> ev.stopPropagation());     // no long-press preview from these buttons
  fb.addEventListener('click', ev=>{
    ev.stopPropagation();
    // right after closing a peek, this tap should only dismiss it — never toggle favorite
    if(swallowTap || Date.now() < suppressUntil) return;
    const k = card.dataset.key;
    if(favs.has(k)){
      askConfirm('Remove favorite?', 'The card "' + k + '" will no longer be marked as a favorite.')
        .then(ok => { if(ok){ toggleFav(k); afterFavChange(k); } });
    }else{
      askConfirm('Add favorite?', 'The card "' + k + '" will be marked as a favorite.')
        .then(ok => { if(ok){ toggleFav(k); afterFavChange(k); } });
    }
  });
  const bb = card.querySelector('.bm-toggle');
  bb.addEventListener('pointerdown', ev=> ev.stopPropagation());
  bb.addEventListener('click', ev=>{
    ev.stopPropagation();
    // right after closing a peek, this tap should only dismiss it — never toggle bookmark
    if(swallowTap || Date.now() < suppressUntil) return;
    const k = card.dataset.key;
    if(bookmark === k){
      const info = bmInfo();
      askConfirm('Remove bookmark?', 'The card "' + (info ? info.word : k) + '" will no longer be marked as your bookmark.')
        .then(ok => { if(ok) setBookmark(k); });
    }else if(bookmark){
      const info = bmInfo();
      askConfirm('Change bookmark?', (info ? 'Your current bookmark on "' + info.word + '"' : 'Your current bookmark') + ' will be replaced with this card.')
        .then(ok => { if(ok) setBookmark(k); });
    }else{
      askConfirm('Set bookmark?', 'This card will be marked as your bookmark so you can jump back to it later.')
        .then(ok => { if(ok) setBookmark(k); });
    }
  });
  const pb = card.querySelector('.play');
  if(!HAS_TTS){ pb.remove(); }
  else{
    pb.addEventListener('pointerdown', ev=> ev.stopPropagation());   // no long-press preview from the button
    pb.addEventListener('click', ev=>{
      ev.stopPropagation();                                          // don't flip the card
      if(swallowTap || Date.now() < suppressUntil) return;           // this tap only dismissed the preview
      if(pb.classList.contains('playing')) stopSpeech();             // ■ = stop right away
      else speak(fullWord(w), pb);
    });
  }
  if(flippedKeys.has(card.dataset.key) || (pendingFlips && pendingFlips.has(card.dataset.key))) card.classList.add('flipped');
  return card;
}

function updateCountSub(){
  const el = document.getElementById('countSub');
  const W = t => `<span style="color:var(--text)">${t}</span>`;
  const base = `Cards: ${W(list.length)}`;
  if(quizMode){
    let quizRight = 0, quizWrong = 0;
    quizResults.forEach(ok => { if(ok) quizRight++; else quizWrong++; });
    el.innerHTML = `${base} · Quiz: ${W('On')} · <b style="color:#1e9e5a">O</b> <span style="color:var(--text)">${quizRight}</span> · <b style="color:#d64545">X</b> <span style="color:var(--text)">${quizWrong}</span>`;
  } else {
    el.innerHTML = `${base} · Quiz: ${W('Off')}`;
  }
}
function refresh(keepReveal, keepPage){
  stopSpeech();
  const q = query.trim().toLowerCase();
  const qp = plain(q);
  list = order.filter(i => {
    if(!(active.has(D[i][4]) || (favOn && favs.has(keyOf(D[i]))))) return false;
    if(!q) return true;
    return idx[i].includes(q) || idx[i].includes(qp);
  });
  page = keepPage ? Math.max(1, Math.min(page, Math.ceil(list.length / pageSize()))) : 1;   // keepPage: stay on this page, or the last one if it no longer exists
  if(!keepReveal) revealAll = false;
  updateCountSub();
  renderPage();
}
function pageList(cur, total){
  // Always show page 1, then fixed blocks of 4: 1 … 5-8 … 495
  if(total <= 5) return Array.from({length: total}, (_, i) => i + 1);
  const start = Math.floor((cur - 1) / 4) * 4 + 1;
  const end = Math.min(start + 3, total);
  const out = [];
  if(start > 1){
    out.push(1);
    if(start > 2) out.push('…');
  }
  for(let n = start; n <= end; n++) out.push(n);
  if(end < total) out.push('…', total);
  return out;
}
function goTo(p){
  const total = Math.max(1, Math.ceil(list.length / pageSize()));
  if(p < 1 || p > total) return;
  // remember exactly where the pager sits on screen before re-rendering,
  // so we can restore that same on-screen position afterwards (no jump/hiccup
  // even if the new page has fewer rows and the document height shrinks)
  const pagerBefore = document.getElementById('pager');
  const beforeTop = pagerBefore ? pagerBefore.getBoundingClientRect().top : null;
  page = p;
  renderPage();
  requestAnimationFrame(()=>{
    const pagerAfter = document.getElementById('pager');
    if(!pagerAfter) return;
    if(beforeTop === null){
      pagerAfter.scrollIntoView({block: 'end', behavior: 'smooth'});
      return;
    }
    const afterTop = pagerAfter.getBoundingClientRect().top;
    const diff = afterTop - beforeTop;
    if(Math.abs(diff) > 0.5){
      window.scrollBy({top: diff, behavior: 'auto'});
    }
  });
}
function changePage(delta){ goTo(page + delta); }

function renderPager(){
  const pager = document.getElementById('pager');
  pager.innerHTML = '';
  const total = Math.max(1, Math.ceil(list.length / pageSize()));
  const prev = document.createElement('button');
  prev.textContent = 'Prev'; prev.disabled = page <= 1;
  prev.addEventListener('click', () => goTo(page - 1));
  pager.appendChild(prev);
  pageList(page, total).forEach(item => {
    if(item === '…'){
      const s = document.createElement('span');
      s.className = 'dots'; s.textContent = '…';
      pager.appendChild(s);
    }else{
      const b = document.createElement('button');
      b.textContent = item;
      if(item === page) b.classList.add('cur');
      b.addEventListener('click', () => goTo(item));
      pager.appendChild(b);
    }
  });
  const next = document.createElement('button');
  next.textContent = 'Next'; next.disabled = page >= total;
  next.addEventListener('click', () => goTo(page + 1));
  pager.appendChild(next);
}
function renderPage(){
  grid.innerHTML = '';
  if(!list.length){
    const msg = (favOn && !favs.size && !query.trim()) ? 'No favorites yet. Tap ☆ on a card.' : 'Kebanyakan mikir keburu diangkat saber.';
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${msg}</div>`;
    renderPager();
    return;
  }
  const start = (page - 1) * pageSize();
  const end = Math.min(start + pageSize(), list.length);
  const frag = document.createDocumentFragment();
  for(let i = start; i < end; i++) frag.appendChild(makeCard(D[list[i]]));
  grid.appendChild(frag);
  renderPager();
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

document.getElementById('shuffleBtn').addEventListener('click', ()=>{ order = shuffle(order.slice()); refresh(true); });
function doRevealAll(){
  // In quiz mode only cards that were already opened count; never-opened cards are left alone.
  const scope = quizMode ? list.filter(i => openedOnce.has(keyOf(D[i]))) : list;
  if(quizMode && scope.length === 0) return;
  const allOpen = scope.length > 0 && scope.every(i => flippedKeys.has(keyOf(D[i])));
  if(allOpen){
    scope.forEach(i => flippedKeys.delete(keyOf(D[i])));
    revealAll = false;
  }else{
    scope.forEach(i => { const k = keyOf(D[i]); flippedKeys.add(k); openedOnce.add(k); });
    revealAll = true;
  }
  grid.querySelectorAll('.card').forEach(c=>{
    const isOpen = flippedKeys.has(c.dataset.key);
    c.classList.toggle('flipped', isOpen);
    if(isOpen){ openedOnce.add(c.dataset.key); c.classList.remove('quiz-pending'); }
  });
}
document.getElementById('revealBtn').addEventListener('click', doRevealAll);

// Clearing the search puts the list back the way it was before typing:
// reveal-all, which cards were flipped, how many cards were loaded, and the scroll position.
function captureState(){
  return {
    reveal: revealAll,
    flipped: new Set([...grid.querySelectorAll('.card.flipped')].map(c => c.dataset.key)),
    page: page,
    scrollY: window.scrollY || 0
  };
}
function restoreFromSnap(){
  const s = searchSnap; searchSnap = null;
  revealAll = s.reveal;
  pendingFlips = s.flipped;
  refresh(true);
  page = s.page;
  renderPage();
  pendingFlips = null;
  requestAnimationFrame(()=> window.scrollTo(0, s.scrollY));
}
let tm;
document.getElementById('q').addEventListener('input', e=>{
  clearTimeout(tm);
  tm = setTimeout(()=>{
    const wasEmpty = query.trim() === '';
    const nowEmpty = e.target.value.trim() === '';
    if(wasEmpty && !nowEmpty) searchSnap = captureState();
    query = e.target.value;
    if(!wasEmpty && nowEmpty && searchSnap) restoreFromSnap();
    else refresh();
  }, 180);
});

document.getElementById('sortBtn').addEventListener('click', ()=>{
  order = D.map((_,i)=>i);     // back to the original order; filters, search and reveal stay as they are
  refresh(true);
});

buildBar();
refresh();
initStorage();
</script>
